name: Agente de Vagas Diário

on:
  schedule:
    # Roda todo dia às 11:00 UTC (que é 08:00 no Brasil)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando num botão

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Instalar bibliotecas
        run: |
          pip install -r requirements.txt

      - name: 🤖 Rodar Agente de Vagas
        env:
          # Aqui conectamos o Cofre ao Código
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_final.py
